services:
  http:
    build: .
    command: [
      "-config", "/etc/app/local.yaml",
    ]
    environment:
      IR_POSTGRES_URI: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      IR_HTTP_PORT: 8000  # Обязательно 8000, проксируется на две строчки ниже
    ports:
      - "${EXTERNAL_HTTP_PORT:-8000}:8000"
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./config:/etc/app:ro

  db:
    image: postgres:15.3-alpine3.18
    command: postgres
    environment:
      POSTGRES_DB: $POSTGRES_DB
      POSTGRES_USER: $POSTGRES_USER
      POSTGRES_PASSWORD: $POSTGRES_PASSWORD
      POSTGRES_VOLUME: $POSTGRES_VOLUME
      POSTGRES_EXTERNAL_PORT: $POSTGRES_EXTERNAL_PORT
    ports:
      - "${POSTGRES_EXTERNAL_PORT:-5432}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB" ]
      interval: 5s
      retries: 5
      start_period: 10s
      timeout: 10s
    volumes:
      - ${POSTGRES_VOLUME:-.pgdata/}:/var/lib/postgresql/data
    networks:
      internal:
        aliases:
          - db

  migrate:
    image: migrate/migrate
    command: [
      "-path", "/migrations",
      "-database", "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable",
      "up"
    ]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    networks:
      internal:

networks:
  internal:
    driver: bridge
