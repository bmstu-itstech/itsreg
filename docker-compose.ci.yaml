x-logging:
  &default-logging
  driver: loki
  options:
    loki-url: "${LOKI_ADDRESS:-http://localhost:3100}/loki/api/v1/push"
    loki-batch-size: 100
    loki-retries: 2
    loki-max-backoff: 1000ms
    loki-timeout: 1s

services:
  http:
    build: .
    command: [
      "-config", "/etc/app/prod.yaml",
    ]
    environment:
      IR_HTTP_PORT: 8000
      IR_POSTGRES_URI: ${IR_POSTGRES_URI}
      IR_JWT_SECRET: ${IR_JWT_SECRET}
      IR_HTTP_CORS_ALLOW_ORIGINS: ${IR_HTTP_CORS_ALLOW_ORIGINS:-}
      IR_PROXY_URL: ${IR_PROXY_URL:-}
      PGSSLROOTCERT: /certs/root.crt
    ports:
      - "${EXTERNAL_HTTP_PORT:-8000}:8000"
    volumes:
      - ./config:/etc/app:ro
      - ${PGSSLROOTCERT:-./certs}:/certs:ro
    networks:
      - internal
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:8000/api/v3/health" ]
      interval: 1m
      retries: 2
      start_period: 10s
      timeout: 3s
    restart: unless-stopped
    logging: *default-logging

  migrate:
    image: migrate/migrate
    command: [
      "-path", "/migrations",
      "-database", "${IR_POSTGRES_URI}",
      "up"
    ]
    environment:
      PGSSLROOTCERT: /certs/root.crt
    volumes:
      - ./migrations:/migrations:ro
      - ${PGSSLROOTCERT:-./certs}:/certs:ro

networks:
  internal:
    driver: bridge
  observability:
    external: true
